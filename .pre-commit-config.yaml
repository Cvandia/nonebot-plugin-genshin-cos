repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    # 检查大文件
    - id: check-added-large-files
    # 检查文件编码
    - id: end-of-file-fixer

- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 26.5.1
  hooks:
    - id: black
      stages: [pre-commit]

# ruff check
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.6
  hooks:
    # Run the linter.
    - id: ruff
      args: [--fix]
    # Run the formatter.
    - id: ruff-format
