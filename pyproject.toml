[tool.pdm]
distribution = true

[tool.pdm.build]
includes = [
    "nonebot_plugin_genshin_cos",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nonebot-plugin-genshin-cos"
version = "0.4.0"
description = "米游社原神cos图获取"
authors = [
    {name = "Cvandia",email = "106718176+Cvandia@users.noreply.github.com"},
]
dependencies = [
    "nonebot-plugin-apscheduler>=0.5.0,<1",
    "nonebot-plugin-alconna>=0.60.0,<1",
    "nonebot-plugin-localstore>=0.7.0,<1",
    "nonebot-adapter-onebot>=2.4.0,<3",
    "nonebot2>=2.4.0,<3",
    "httpx>=0.27.0,<1",
    "anyio>=4.0.0,<5",
]
requires-python = "<4,>=3.10"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "nonebot2[fastapi]>=2.4.0,<3",
    "pre-commit>=4.0.1",
    "ruff>=0.15.13",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
